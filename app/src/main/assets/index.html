
<!-- ABA Pay Add Money -->
<div class="card" id="addMoneyCard">
  <h2>টাকা যোগ করুন</h2>
  <p class="small">পরীক্ষামূলক লেনদেন — আসল টাকা নয়</p>

  <label for="paymentMethod">পেমেন্ট পদ্ধতি</label>
  <select id="paymentMethod" style="width:100%;padding:13px;margin:8px 0;border:1px solid #d6dce5;border-radius:9px">
    <option value="bKash">bKash</option>
    <option value="Nagad">Nagad</option>
  </select>

  <label for="addAmount">টাকার পরিমাণ (৳)</label>
  <input id="addAmount" type="number" min="10" max="10000" placeholder="যেমন: 100">

  <button class="full" onclick="addTestMoney()">Add Money</button>
  <p id="paymentMessage" role="status"></p>
</div>
